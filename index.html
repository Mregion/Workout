<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>My Workout</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111318;
      color: white;
    }

    .container {
      width: min(1000px, 94%);
      margin: auto;
      padding: 30px 0;
    }

    h1 {
      margin-bottom: 5px;
      font-size: 36px;
    }

    .subtitle {
      color: #9ca3af;
      margin-bottom: 25px;
    }

    /* DAYS */

    .days {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 25px;
    }

    .day-button {
      border: 1px solid #333842;
      background: #1b1f27;
      color: white;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
    }

    .day-button:hover {
      background: #252b35;
    }

    .day-button.active {
      background: #58d6b9;
      color: #08251f;
      border-color: #58d6b9;
    }

    /* WORKOUT CARD */

    .workout-card {
      background: #191d24;
      border: 1px solid #2c323d;
      border-radius: 16px;
      overflow: hidden;
    }

    .workout-header {
      padding: 20px;
      border-bottom: 1px solid #2c323d;
    }

    .workout-header h2 {
      margin: 0 0 7px 0;
    }

    .workout-note {
      color: #9ca3af;
      font-size: 14px;
    }

    /* TABLE */

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th {
      background: #14171d;
      color: #aeb7c3;
      font-size: 13px;
      text-transform: uppercase;
      padding: 14px;
      text-align: left;
    }

    td {
      padding: 15px 14px;
      border-top: 1px solid #2c323d;
    }

    .exercise {
      font-weight: bold;
    }

    .sets,
    .reps,
    .rest {
      white-space: nowrap;
    }

    /* MOBILE */

    @media (max-width: 600px) {
      h1 {
        font-size: 28px;
      }

      .container {
        width: 96%;
      }

      .day-button {
        flex: 1;
        min-width: 80px;
      }
    }
  </style>
</head>

<body>

</div>

function showWorkout(day, clickedButton) {

  const workout = workouts[day];

  document.getElementById("workoutTitle").textContent =
    workout.title;

  document.getElementById("workoutNote").textContent =
    workout.note;


  const table =
    document.getElementById("workoutTable");

  table.innerHTML = "";


  workout.exercises.forEach(item => {

    const row =
      document.createElement("tr");


    row.innerHTML = `

      <td class="exercise">
        ${item.exercise}
      </td>

      <td class="sets">
        ${item.sets}
      </td>

      <td class="reps">
        ${item.reps}
      </td>

      <td class="rest">
        ${item.rest}
      </td>

      <td>
        ${item.rir}
      </td>

    `;


    table.appendChild(row);

  });


  document
    .querySelectorAll(".day-button")
    .forEach(button =>
      button.classList.remove("active")
    );


  clickedButton.classList.add("active");

}
